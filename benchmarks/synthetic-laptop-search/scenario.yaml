id: synthetic-laptop-search
name: Find the cheapest qualifying laptop (synthetic)
version: 1
tags:
  - ecommerce
  - search
  - comparison
  - synthetic

har: session.har
goal: goal.md
expected: expected.json

evaluation:
  type: fields
  required_fields:
    - product_id
    - price
    - currency
    - in_stock
  allow_extra_fields: true
  normalizers:
    price:
      currency: true
      numeric_tolerance: 0.01
    currency:
      case: upper
      whitespace: trim

limits:
  generate:
    max_steps: 60
    timeout_seconds: 300
  answer:
    max_steps: 20
    timeout_seconds: 90
