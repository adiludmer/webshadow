# Test fixture: twelve items from a Geektime capture, including the JSON
# feeds that carry the Enso headline. Not part of the benchmark suite.
id: geektime-enso-funding
name: How much did Enso raise in its latest round (Geektime)
version: 1
tags:
  - test-fixture

evaluation:
  type: fields
  required_fields:
    - amount
    - currency
  allow_extra_fields: true
  normalizers:
    amount:
      currency: true
    currency:
      case: upper
      whitespace: trim

limits:
  generate:
    max_steps: 200
    timeout_seconds: 900
  answer:
    max_steps: 20
    timeout_seconds: 120
