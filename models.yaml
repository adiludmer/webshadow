# Models the benchmark can run, as generators or readers. Run records name
# models by id.
models:
  # A local GGUF model run in-process by llama.cpp. Needs a binary built
  # with `make llama`; point WEBSHADOW_LLAMA_MODEL at the model file.
  - id: local-llama
    adapter: llama
    model_path: ${WEBSHADOW_LLAMA_MODEL}
    context_size: 16384
    max_tokens: 2048
    temperature: 0

  # Local models that `make bench MODEL=<id>` downloads into models/.
  # Q4_K_M quantizations; the 7B and 8B need about 6GB of RAM at this context.
  - id: qwen2.5-7b
    adapter: llama
    model_path: ${WEBSHADOW_MODELS_DIR}/qwen2.5-7b.gguf
    context_size: 16384
    max_tokens: 2048
    temperature: 0

  - id: qwen2.5-3b
    adapter: llama
    model_path: ${WEBSHADOW_MODELS_DIR}/qwen2.5-3b.gguf
    context_size: 16384
    max_tokens: 2048
    temperature: 0

  - id: llama3.1-8b
    adapter: llama
    model_path: ${WEBSHADOW_MODELS_DIR}/llama3.1-8b.gguf
    context_size: 16384
    max_tokens: 2048
    temperature: 0

  # Replies with fixed text; for smoke-testing the pipeline without a model.
  - id: fake-noop
    adapter: fake
    replies:
      - '{"action": "finish", "answer": {}}'
