# Models the benchmark can run, as generators or readers. Run records name
# models by id. API keys never go here: api_key_env names the environment
# variable that holds one.
models:
  # Replies with fixed text; for smoke-testing the pipeline without a model.
  - id: fake-noop
    adapter: fake
    replies:
      - '{"action": "finish", "answer": {}}'

  # A local GGUF model run in-process by llama.cpp. Needs a binary built
  # with `make llama`.
  - id: local-llama
    adapter: llama
    model_path: ${WEBSHADOW_LLAMA_MODEL}
    context_size: 16384
    max_tokens: 2048
    temperature: 0

  - id: gpt-4.1-mini
    adapter: openai_compatible
    model: gpt-4.1-mini
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_tokens: 4096
    temperature: 0

  # Any OpenAI-format server works, including OpenRouter and vLLM.
  - id: openrouter-qwen3-coder
    adapter: openai_compatible
    model: qwen/qwen3-coder
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 4096
    temperature: 0
